[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musings-inbox"
version = "0.1.1"
description = "Local-first life-log / inspiration inbox for AI agents — plain Markdown, no vendor lock-in"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
musings-inbox = "musings_inbox.inbox:main"

[tool.setuptools.packages.find]
where = ["src"]
